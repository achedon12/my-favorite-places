---
- name: Deploy Traefik stack on Docker Swarm
  hosts: manager
  vars:
    stack_file: ../stacks/traefik-stack.yml
    stack_name: traefik
  tasks:
    - name: Create web overlay network
      community.docker.docker_network:
        name: web
        driver: overlay
        driver_options:
          com.docker.network.driver.overlay.vxlanid: "4096"
      become: true

    - name: Deploy Traefik stack
      community.docker.docker_stack:
        state: present
        name: "{{ stack_name }}"
        compose: "{{ stack_file }}"
      become: true

    - name: Update /etc/hosts for traefik.swarm.localhost
      lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.0\.1.*traefik\.swarm\.localhost'
        line: '127.0.0.1 traefik.swarm.localhost'
        state: present
      become: true

    - name: Update /etc/hosts for whoami.swarm.localhost
      lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.0\.1.*whoami\.swarm\.localhost'
        line: '127.0.0.1 whoami.swarm.localhost'
        state: present
      become: true

    - name: Wait for Traefik to be ready
      wait_for:
        host: localhost
        port: 80
        delay: 5
        timeout: 30
      become: true

    - name: Display Traefik status
      debug:
        msg:
          - "Traefik Dashboard: http://traefik.swarm.localhost:8080"
          - "Whoami Service: http://whoami.swarm.localhost"
          - "Check /etc/hosts was updated correctly"
