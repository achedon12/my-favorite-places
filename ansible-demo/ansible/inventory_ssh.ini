# Inventaire pour VMs/VPS Linux accessibles en SSH
# Au lieu de containers Docker

[managers]
# Adresses IP ou noms de domaine des VMs/VPS managers
# manager1.example.com
# 192.168.1.10
manager-vm-1 ansible_host=192.168.1.10

[managers:vars]
# Connexion SSH (par défaut, pas besoin de le spécifier)
ansible_connection=ssh
# Utilisateur SSH pour se connecter
ansible_user=ubuntu
# ou ansible_user=root selon votre configuration
# Pour l'authentification par clé privée
# ansible_ssh_private_key_file=/home/user/.ssh/id_rsa
# Pour l'authentification par mot de passe (moins sûr)
# ansible_ssh_pass=votre_motdepasse
# Port SSH (par défaut 22)
# ansible_port=22
# IP du manager pour la jointure des workers
manager_ip=192.168.1.10

[workers]
# Adresses IP ou noms de domaine des VMs/VPS workers
worker-vm-1 ansible_host=192.168.1.11
worker-vm-2 ansible_host=192.168.1.12
worker-vm-3 ansible_host=192.168.1.13
worker-vm-4 ansible_host=192.168.1.14

[workers:vars]
# Connexion SSH
ansible_connection=ssh
# Utilisateur SSH
ansible_user=ubuntu
# Authentification par clé (recommandé)
# ansible_ssh_private_key_file=/home/user/.ssh/id_rsa
# ou authentification par mot de passe
# ansible_ssh_pass=votre_motdepasse

