- name: Initialize Docker Swarm Cluster
  hosts: managers
  become: yes
  gather_facts: no
  tasks:
    - name: Initialize swarm on first manager
      raw: docker swarm init
      register: swarm_init
      failed_when: 
        - swarm_init.rc != 0
        - "'This node is already part of a swarm' not in swarm_init.stderr"
      changed_when: "'Swarm initialized' in swarm_init.stdout"

    - name: Retrieve worker join token
      command: docker swarm join-token worker -q
      register: worker_token
      run_once: true

    - name: Get manager IP address
      command: hostname -i
      register: manager_ip
      run_once: true

    - name: Set worker join command as a fact
      set_fact:
        worker_join_command: "docker swarm join --token {{ worker_token.stdout }} {{ manager_ip.stdout }}:2377"
      run_once: true

    - name: Display swarm initialization info
      debug:
        msg: "Manager initialized. Worker join token: {{ worker_token.stdout }}"
      run_once: true

- name: Join workers to the Swarm cluster
  hosts: workers
  gather_facts: no
  tasks:
    - name: Join swarm as worker
      command: "{{ hostvars[groups['managers'][0]]['worker_join_command'] }}"
      register: worker_join
      failed_when: 
        - worker_join.rc != 0
        - "'This node is already part of a swarm' not in worker_join.stderr"
      changed_when: "'This node joined a swarm' in worker_join.stdout"

    - name: Display worker join status
      debug:
        msg: "Worker {{ inventory_hostname }} joined the swarm"

- name: Verify Swarm cluster
  hosts: managers
  gather_facts: no
  tasks:
    - name: List swarm nodes
      command: docker node ls
      register: node_list
      run_once: true

    - name: Display swarm nodes
      debug:
        msg: "{{ node_list.stdout_lines }}"
      run_once: true

