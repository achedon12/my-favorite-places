- name: Deploy Docker Stack Example
  hosts: managers
  become: yes
  gather_facts: no
  vars:
    stack_name: example-stack
    stack_file: /stacks/example-stack.yml

  tasks:
    - name: Check if stack file exists
      stat:
        path: "{{ stack_file }}"
      register: stack_file_stat
      run_once: true

    - name: Fail if stack file does not exist
      fail:
        msg: "Stack file {{ stack_file }} does not exist"
      when: not stack_file_stat.stat.exists
      run_once: true

    - name: Deploy Docker stack
      command: "docker stack deploy -c {{ stack_file }} {{ stack_name }} --detach=false"
      register: deploy_result
      changed_when: "'deployed' in deploy_result.stdout"
      run_once: true

    - name: Display deployment result
      debug:
        var: deploy_result.stdout_lines
      run_once: true

    - name: List deployed services
      command: docker service ls
      register: services_list
      run_once: true

    - name: Display deployed services
      debug:
        var: services_list.stdout_lines
      run_once: true

